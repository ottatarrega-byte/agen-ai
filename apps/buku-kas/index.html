<style>

  --c1:#8FA7F2; --c2:#5DC690; --c3:#F0A262; --c4:#C79BEA; --c5:#5CC7D0; --c6:#EE8DB0; --c7:#C9C56A; --c8:#A3ACB5;

}}

<script>
(() => {
'use strict';
const SHEET_ID = '1E5jpWWc7ZuA1TlApU9f5hmdGYGQCasgg4_m0N2k3WpU';
const SRV = 'Google Sheets';
const SOURCE_TAG = 'app';
const BULAN = ['Januari','Februari','Maret','April','Mei','Juni','Juli','Agustus','September','Oktober','November','Desember'];
const BLN = ['Jan','Feb','Mar','Apr','Mei','Jun','Jul','Agu','Sep','Okt','Nov','Des'];
const HARI = ['Minggu','Senin','Selasa','Rabu','Kamis','Jumat','Sabtu'];
const DEFAULT_CATS = [
  ['Sewa','Tetap','Keluar'],['Utilitas & Tagihan','Tetap','Keluar'],['Subscriptions','Tetap','Keluar'],['Asuransi','Tetap','Keluar'],['Cicilan','Tetap','Keluar'],
  ['Makan & Minum','Variabel','Keluar'],['Groceries','Variabel','Keluar'],['Transport','Variabel','Keluar'],['Rumah Tangga','Variabel','Keluar'],['Kesehatan','Variabel','Keluar'],
  ['Hiburan & Hobi','Variabel','Keluar'],['Belanja','Variabel','Keluar'],['Perawatan Diri','Variabel','Keluar'],['Perjalanan','Sekali','Keluar'],['Hadiah & Sosial','Sekali','Keluar'],
  ['Top-up E-wallet','Variabel','Keluar'],['Biaya Produksi & Tools','Variabel','Keluar'],['Pendapatan (belum dipilah)','Variabel','Masuk'],['Bayar CC','Sekali','Netral'],
  ['Transfer Antar Rekening Sendiri','Sekali','Netral'],['Transfer ke Orang','Sekali','Netral'],['Investasi','Sekali','Netral'],['Talangan & Reimburse','Sekali','Netral'],
  ['Pendapatan Musik','Variabel','Masuk'],['Pendapatan Lain','Variabel','Masuk'],['Bukan Pendapatan','Sekali','Netral']
].map(([name,sifat,arah]) => ({name,sifat,arah}));
const UNCLEAR = 'BELUM JELAS';

/* ---------- storage (per-viewer convenience only) ---------- */
const store = {
  get(k){ try { return localStorage.getItem('bk_'+k); } catch { return null; } },
  set(k,v){ try { localStorage.setItem('bk_'+k, v); } catch {} }
};

/* ---------- state ---------- */
const S = {
  mode: 'boot',          // boot | loading | live | sample | error
  onboard: store.get('onboarded') ? -1 : 0,
  tab: 'beranda',
  tx: [], cats: DEFAULT_CATS.slice(), porsi: 0.5,
  saldo: null, saldoNote: '', dash: {}, warn: {}, split: [], kurs: [],
  sections: {},          // per-range error codes for secondary tabs
  err: null, loadedAt: null, refreshing: false,
  month: null, hFilter: 'semua', hQuery: '',
  sheet: null,           // overlay state
  mcp: null, sample: null
};

/* ---------- helpers ---------- */
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const pad = n => String(n).padStart(2,'0');
const ymd = d => `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const hm = d => `${pad(d.getHours())}:${pad(d.getMinutes())}`;
const mkey = s => s.slice(0,7);
const parseYMD = s => { const [y,m,d] = s.split('-').map(Number); return new Date(y, m-1, d); };
const addMonths = (k, n) => { let [y,m] = k.split('-').map(Number); m += n; while (m < 1) { m += 12; y--; } while (m > 12) { m -= 12; y++; } return `${y}-${pad(m)}`; };
const monthLabel = (k, long) => { const [y,m] = k.split('-').map(Number); return (long ? BULAN : BLN)[m-1] + ' ' + y; };
const daysIn = k => { const [y,m] = k.split('-').map(Number); return new Date(y, m, 0).getDate(); };
const serial = s => { const [y,m,d] = s.split('-').map(Number); return Math.round((Date.UTC(y,m-1,d) - Date.UTC(1899,11,30)) / 86400000); };
const fromSerial = n => { const d = new Date(Date.UTC(1899,11,30) + Math.round(n)*86400000); return `${d.getUTCFullYear()}-${pad(d.getUTCMonth()+1)}-${pad(d.getUTCDate())}`; };
const rp = n => (n < 0 ? '-' : '') + 'Rp ' + Math.round(Math.abs(n)).toLocaleString('id-ID');
const rpShort = n => {
  const a = Math.abs(n), s = n < 0 ? '-' : '';
  const dec = (v, p) => v.toFixed(p).replace(/\.?0+$/,'').replace('.', ',');
  if (a >= 1e9) return s + 'Rp' + dec(a/1e9, 2) + 'M';
  if (a >= 1e6) return s + 'Rp' + dec(a/1e6, a >= 1e8 ? 0 : a >= 1e7 ? 1 : 2) + 'jt';
  if (a >= 1e3) return s + 'Rp' + Math.round(a/1e3) + 'rb';
  return s + 'Rp' + Math.round(a);
};
function num(v){
  if (v == null) return 0;
  if (typeof v === 'number') return v;
  let s = String(v).trim();
  if (!s || s === '–' || s === '-' || s === '—') return 0;
  const neg = /^\(.*\)$/.test(s) || /^-/.test(s);
  s = s.replace(/[()\s]|Rp|-/g, '');
  if (s.endsWith('%')) return parseFloat(s) / 100 * (neg ? -1 : 1);
  s = s.replace(/,/g, '');
  const n = parseFloat(s);
  return isNaN(n) ? 0 : (neg ? -n : n);
}
function normDate(v){
  const s = String(v ?? '').trim();
  if (/^\d{4}-\d{2}-\d{2}/.test(s)) return s.slice(0,10);
  if (/^\d{5}(\.\d+)?$/.test(s)) return fromSerial(parseFloat(s));
  const m = s.match(/^(\d{1,2})\/(\d{1,2})\/(\d{4})$/);
  if (m) return `${m[3]}-${pad(m[2])}-${pad(m[1])}`;
  return '';
}
function normTime(v){
  const s = String(v ?? '').trim();
  if (/^\d{1,2}:\d{2}/.test(s)) { const [h,mi] = s.split(':'); return pad(h)+':'+mi.slice(0,2); }
  if (/^0?\.\d+$/.test(s)) { const mins = Math.round(parseFloat(s) * 1440); return pad(Math.floor(mins/60)) + ':' + pad(mins % 60); }
  return '';
}
const today = () => ymd(new Date());

const CAT_CODE = {};
const catCode = name => {
  if (CAT_CODE[name]) return CAT_CODE[name];
  if (name === UNCLEAR) return CAT_CODE[name] = { code:'??', tone:'var(--warn)' };
  const words = name.replace(/[()&-]/g,' ').split(/\s+/).filter(Boolean);
  const code = (words.length > 1 ? words[0][0] + words[1][0] : name.slice(0,2)).toUpperCase();
  let h = 0; for (const c of name) h = (h * 31 + c.charCodeAt(0)) >>> 0;
  return CAT_CODE[name] = { code, tone: `var(--c${(h % 8) + 1})` };
};
const catInfo = name => S.cats.find(c => c.name === name) || null;
const arahOff = t => { const c = catInfo(t.kat); return !!c && c.arah !== t.arah; };

/* ---------- data shaping ---------- */
function shapeTx(values){
  const out = [];
  values.forEach((r, i) => {
    const date = normDate(r[0]);
    if (!date) return;
    out.push({
      row: i + 2,
      date, time: normTime(r[1]),
      src: String(r[3] ?? '').trim(),
      arah: String(r[4] ?? '').trim() || 'Keluar',
      kat: String(r[5] ?? '').trim() || UNCLEAR,
      sifat: String(r[6] ?? '').trim(),
      konteks: String(r[7] ?? '').trim() || 'Pribadi',
      ket: String(r[8] ?? '').trim(),
      nominal: num(r[9]),
      shared: String(r[10]).toUpperCase() === 'TRUE',
      porsi: num(r[11])
    });
  });
  out.sort((a,b) => (b.date + b.time).localeCompare(a.date + a.time));
  return out;
}
function shapeSettings(values){
  const cats = [];
  let inCats = false;
  for (const r of values) {
    const a = String(r[0] ?? '').trim(), b = String(r[1] ?? '').trim();
    if (a === 'Porsi Otta untuk beban bersama') S.porsi = num(b) || 0.5;
    if (a === 'Saldo BCA terakhir') { S.saldo = num(b); S.saldoNote = String(r[2] ?? ''); }
    if (a === 'Kategori' && b.toLowerCase().startsWith('sifat')) { inCats = true; continue; }
    if (inCats) {
      if (!a) { inCats = false; continue; }
      cats.push({ name:a, sifat:b || 'Variabel', arah:String(r[2] ?? '').trim() || 'Keluar' });
    }
    const g = String(r[6] ?? '').trim();
    if (/^[A-Z]{3}$/.test(g) && r[8]) S.kurs.push({ cur:g, rate:num(r[8]) });
  }
  if (cats.length) S.cats = cats;
}
function shapeDash(values){
  const d = {}, w = {};
  for (const r of values) {
    const a = String(r[0] ?? '').trim();
    if (a && r[1] != null && r[1] !== '') d[a] = r[1];
    const c = String(r[3] ?? '').trim();
    if (c && r[4] != null && r[4] !== '') w[c] = r[4];
  }
  S.dash = d; S.warn = w;
}
function shapeSplit(values){
  S.split = values.filter(r => r[0] && /\d{4}$/.test(String(r[0])) ).map(r => ({ bulan:String(r[0]), total:num(r[1]), otta:num(r[2]), wanda:num(r[3]) }));
  const tot = values.find(r => String(r[0]).trim() === 'TOTAL');
  S.splitTotal = tot ? { total:num(tot[1]), otta:num(tot[2]), wanda:num(tot[3]) } : null;
}
const dashFind = prefix => { const k = Object.keys(S.dash).find(k => k.toLowerCase().startsWith(prefix.toLowerCase())); return k ? { label:k, value:S.dash[k] } : null; };

function monthStats(k){
  const rows = S.tx.filter(t => mkey(t.date) === k);
  const st = { k, rows, out:0, in:0, netral:0, cats:{}, days:{}, sifat:{}, kerja:0, shared:0, unclear:0, provisional:0, count:0 };
  for (const t of rows) {
    if (t.arah === 'Keluar') {
      st.out += t.nominal; st.count++;
      st.cats[t.kat] = (st.cats[t.kat] || 0) + t.nominal;
      st.days[t.date] = (st.days[t.date] || 0) + t.nominal;
      const sf = t.sifat || 'Variabel'; st.sifat[sf] = (st.sifat[sf] || 0) + t.nominal;
      if (t.konteks === 'Kerja') st.kerja += t.nominal;
      if (t.shared) st.shared += t.nominal;
    } else if (t.arah === 'Masuk') st.in += t.nominal;
    else st.netral += t.nominal;
    if (t.kat === UNCLEAR || t.kat === 'Pendapatan (belum dipilah)') st.unclear++;
    if (t.src.startsWith('email')) st.provisional++;
  }
  return st;
}
function catAverages(uptoK){
  const months = [];
  for (let i = 1; i <= 12; i++) {
    const k = addMonths(uptoK, -i);
    if (S.tx.some(t => mkey(t.date) === k)) months.push(k);
  }
  const sum = {};
  for (const t of S.tx) if (t.arah === 'Keluar' && months.includes(mkey(t.date))) sum[t.kat] = (sum[t.kat] || 0) + t.nominal;
  const avg = {}; for (const c in sum) avg[c] = sum[c] / (months.length || 1);
  return { avg, months };
}

/* ---------- connector ---------- */
function payloadOf(res){
  let p = res && (res.payload ?? res.structuredContent);
  if (typeof p === 'string') { try { p = JSON.parse(p); } catch {} }
  return p || {};
}
async function getRange(range, refresh){
  const res = await S.mcp.callTool(SRV, 'get_values', { spreadsheetId:SHEET_ID, range }, { cache: { staleTime: 120000, gcTime: 900000, refresh: !!refresh } });
  const p = payloadOf(res);
  if (res && res.cache && res.cache.storedAt) S.loadedAt = res.cache.storedAt;
  return Array.isArray(p.values) ? p.values : [];
}
const sleep = ms => new Promise(r => setTimeout(r, ms));
async function loadAll(refresh){
  if (!S.mcp) return enterSample();
  S.refreshing = true;
  if (S.mode !== 'live') S.mode = 'loading';
  render();
  const ranges = ['Transaksi!A2:L', 'Pengaturan!A1:I60', 'Dashboard!A1:E80', 'Split!A1:D30'];
  const attempt = () => Promise.allSettled(ranges.map(r => getRange(r, refresh)));
  let res = await attempt();
  const retryable = res[0].status === 'rejected' && res[0].reason && res[0].reason.retryable;
  if (retryable) { await sleep(800 + Math.random() * 900 + (res[0].reason.retryAfterMs || 0)); res = await attempt(); }
  S.refreshing = false;
  if (res[0].status === 'rejected') {
    S.err = res[0].reason || { code:'upstream_error', message:'Tidak ada jawaban' };
    S.mode = S.tx.length ? 'live' : 'error';
    if (S.mode === 'live') toast(errCopy(S.err).short);
    render(); return;
  }
  S.err = null;
  S.tx = shapeTx(res[0].value);
  S.kurs = [];
  S.sections = {};
  ['set','dash','split'].forEach((name, i) => { if (res[i+1].status === 'rejected') S.sections[name] = res[i+1].reason; });
  if (res[1].status === 'fulfilled') shapeSettings(res[1].value);
  if (res[2].status === 'fulfilled') shapeDash(res[2].value);
  if (res[3].status === 'fulfilled') shapeSplit(res[3].value);
  if (!S.loadedAt || refresh) S.loadedAt = Date.now();
  S.mode = 'live';
  if (!S.month) S.month = mkey(today());
  render();
}
function errCopy(e){
  const code = e && e.code;
  switch (code) {
    case 'needs_reauth': return { title:'Google Sheets perlu disambung ulang', body:'Sambungan ke akun Google kamu sudah kedaluwarsa. Buka claude.ai, Settings, Connectors, lalu sambungkan ulang Google Sheets.', short:'Google Sheets perlu disambung ulang', retry:false };
    case 'server_not_connected': return { title:'Google Sheets belum ditambahkan', body:'Tambahkan connector Google Sheets di claude.ai, Settings, Connectors. Setelah itu buka lagi halaman ini.', short:'Google Sheets belum ditambahkan', retry:false };
    case 'selection_required': return { title:'Pilih akun Google Sheets', body:'Ada lebih dari satu Google Sheets yang tersambung. Pilih satu di prompt claude.ai, lalu coba lagi.', short:'Pilih akun Google Sheets dulu', retry:true };
    case 'not_in_manifest': case 'approval_required': case 'consent_required': return { title:'Akses ke sheet belum diizinkan', body:'Halaman ini butuh izin baca dan tulis ke Google Sheets kamu. Izinkan saat ditanya, atau aktifkan lewat menu Permissions artifact ini.', short:'Akses ke sheet belum diizinkan', retry:true, perms:true };
    case 'blocked_by_policy': return { title:'Diblokir kebijakan organisasi', body:'Akun kamu tidak diizinkan memakai Google Sheets dari halaman ini.', short:'Diblokir kebijakan organisasi', retry:false };
    case 'server_unavailable': return { title:'Google Sheets lagi tidak menjawab', body:'Biasanya beres dalam semenit. Data terakhir tetap tampil kalau ada.', short:'Google Sheets lagi tidak menjawab', retry:true };
    case 'tool_error': return { title:'Sheet menolak permintaan', body:(e.message || 'Google Sheets melaporkan error.') + ' Cek apakah sheet masih bisa kamu buka.', short:'Sheet menolak permintaan', retry:true };
    case 'not_granted': case 'capability_disabled': case 'capability_removed': return { title:'Connector tidak tersedia di tampilan ini', body:'Buka halaman ini di claude.ai untuk tersambung ke sheet.', short:'Connector tidak tersedia di sini', retry:false };
    default: return { title:'Sheet belum bisa dibaca', body:(e && e.message) || 'Terjadi masalah saat menghubungi Google Sheets.', short:'Sheet belum bisa dibaca', retry:true };
  }
}

/* ---------- writes ---------- */
function rowFor(d){
  const cat = catInfo(d.kat) || { arah:'Keluar', sifat:'Variabel' };
  const t = d.time ? d.time.split(':').map(Number) : null;
  const shared = !!d.shared;
  return [
    serial(d.date),
    t ? +( (t[0]*60 + t[1]) / 1440 ).toFixed(10) : '',
    serial(d.date.slice(0,8) + '01'),
    SOURCE_TAG,
    cat.arah,
    d.kat,
    cat.sifat,
    d.konteks || 'Pribadi',
    d.ket,
    Math.round(d.nominal),
    shared,
    shared ? Math.round(d.nominal * S.porsi) : ''
  ];
}
async function saveDrafts(drafts){
  const valid = drafts.filter(d => d.ket && d.nominal && d.date && d.kat);
  if (!valid.length) { toast('Isi keterangan dan nominal dulu'); return false; }
  if (S.mode === 'sample') {
    valid.forEach(d => S.tx.unshift(localTx(d)));
    S.tx.sort((a,b) => (b.date + b.time).localeCompare(a.date + a.time));
    toast(`Mode contoh: ${valid.length} transaksi tidak dikirim ke sheet`);
    return true;
  }
  try {
    await S.mcp.callTool(SRV, 'append_values', { spreadsheetId:SHEET_ID, range:'Transaksi!A:L', values: valid.map(rowFor) }, { cache:false });
    valid.forEach(d => S.tx.unshift(localTx(d)));
    S.tx.sort((a,b) => (b.date + b.time).localeCompare(a.date + a.time));
    toast(valid.length > 1 ? `${valid.length} transaksi masuk ke sheet` : 'Masuk ke sheet');
    S.mcp.invalidate(SRV, 'get_values').catch(() => {});
    setTimeout(() => loadAll(true), 1200);
    return true;
  } catch (e) {
    const ambiguous = ['server_unavailable','upstream_error','cancelled'].includes(e && e.code) || !(e && e.code);
    if (ambiguous) {
      toast('Belum pasti tersimpan. Memeriksa sheet…');
      await loadAll(true);
      const found = valid.every(d => S.tx.some(t => t.src === SOURCE_TAG && t.date === d.date && t.ket === d.ket && Math.round(t.nominal) === Math.round(d.nominal)));
      toast(found ? 'Ternyata sudah masuk ke sheet' : 'Tidak tersimpan. Coba simpan lagi.');
      return found;
    }
    toast(errCopy(e).short);
    return false;
  }
}
function localTx(d){
  const cat = catInfo(d.kat) || { arah:'Keluar', sifat:'Variabel' };
  return { row:null, pending:true, date:d.date, time:d.time || '', src:SOURCE_TAG, arah:cat.arah, kat:d.kat, sifat:cat.sifat, konteks:d.konteks || 'Pribadi', ket:d.ket, nominal:Math.round(d.nominal), shared:!!d.shared, porsi:d.shared ? d.nominal * S.porsi : 0 };
}
async function saveEdit(t, patch){
  const cat = catInfo(patch.kat) || { arah:t.arah, sifat:t.sifat };
  const next = { ...t, ...patch, arah:cat.arah, sifat:cat.sifat };
  if (S.mode === 'sample') { Object.assign(t, next); toast('Mode contoh: perubahan tidak dikirim'); return true; }
  if (!t.row) { toast('Baris ini belum punya nomor di sheet. Muat ulang dulu.'); return false; }
  try {
    const check = await S.mcp.callTool(SRV, 'get_values', { spreadsheetId:SHEET_ID, range:`Transaksi!A${t.row}:L${t.row}` }, { cache:false });
    const r = (payloadOf(check).values || [])[0] || [];
    const same = normDate(r[0]) === t.date && String(r[8] ?? '').trim() === t.ket && Math.round(num(r[9])) === Math.round(t.nominal);
    if (!same) { toast('Baris di sheet sudah bergeser. Memuat ulang…'); await loadAll(true); return false; }
    const vals = [next.arah, next.kat, next.sifat, next.konteks, next.ket, Math.round(next.nominal), !!next.shared];
    let range = `Transaksi!E${t.row}:K${t.row}`;
    if (t.src === SOURCE_TAG) { vals.push(next.shared ? Math.round(next.nominal * S.porsi) : ''); range = `Transaksi!E${t.row}:L${t.row}`; }
    await S.mcp.callTool(SRV, 'update_values', { spreadsheetId:SHEET_ID, range, values:[vals] }, { cache:false });
    Object.assign(t, next);
    toast('Sheet diperbarui');
    S.mcp.invalidate(SRV, 'get_values').catch(() => {});
    return true;
  } catch (e) {
    toast(['server_unavailable','upstream_error'].includes(e && e.code) ? 'Belum pasti tersimpan. Cek baris ini setelah muat ulang.' : errCopy(e).short);
    return false;
  }
}

const KEYWORDS = [
  [/kopi|coffee|cafe|kafe|makan|nasi|bakso|mie|sate|ayam|warung|resto|lunch|dinner|sarapan|jajan|teh|boba|snack|cilok|soto|padang|grabfood|gofood/i, 'Makan & Minum'],
  [/parkir|grab(?!food)|gojek|gocar|goride|ojek|taxi|taksi|bensin|pertamax|tol|krl|mrt|transjakarta|kereta|bus/i, 'Transport'],
  [/sayur|buah|indomaret|alfamart|superindo|astro|groceries|belanja dapur|telur|beras|minyak/i, 'Groceries'],
  [/laundry|galon|gas|sabun|deterjen|tisu|rumah/i, 'Rumah Tangga'],
  [/listrik|pln|air pdam|internet|wifi|pulsa|token/i, 'Utilitas & Tagihan'],
  [/spotify|netflix|youtube|icloud|apple|google one|chatgpt|claude|subscription|langganan/i, 'Subscriptions'],
  [/obat|dokter|apotek|klinik|vitamin|bpjs/i, 'Kesehatan'],
  [/plugin|splice|studio|mic|kabel|senar|gitar|mixing|mastering|distrokid|produksi/i, 'Biaya Produksi & Tools'],
  [/tokopedia|shopee|baju|sepatu|belanja/i, 'Belanja'],
  [/potong rambut|barber|salon|skincare/i, 'Perawatan Diri'],
  [/nonton|bioskop|konser|game|buku/i, 'Hiburan & Hobi'],
  [/kado|hadiah|sumbangan|kondangan/i, 'Hadiah & Sosial'],
  [/top ?up|topup/i, 'Top-up E-wallet'],
];
function parseAmount(seg){
  const m = seg.match(/(\d{1,3}(?:[.,]\d{3})+|\d+(?:[.,]\d+)?)\s*(k|rb|ribu|jt|juta)?\b/i);
  if (!m) return null;
  let raw = m[1], unit = (m[2] || '').toLowerCase(), n;
  if (/^\d{1,3}([.,]\d{3})+$/.test(raw) && !unit) n = parseFloat(raw.replace(/[.,]/g, ''));
  else n = parseFloat(raw.replace(',', '.'));
  if (unit === 'k' || unit === 'rb' || unit === 'ribu') n *= 1e3;
  if (unit === 'jt' || unit === 'juta') n *= 1e6;
  return { n: Math.round(n), match: m[0] };
}
function localParse(text){
  const base = new Date();
  return text.split(/\s+(?:dan|and|&|terus|lalu)\s+|,(?!\d)|[;\n]+/i).map(s => s.trim()).filter(Boolean).map(seg => {
    const a = parseAmount(seg);
    let d = new Date(base);
    if (/kemarin/i.test(seg)) d.setDate(d.getDate() - 1);
    const shared = /berdua|sama wanda|split|bagi dua/i.test(seg);
    let ket = (a ? seg.replace(a.match, '') : seg).replace(/kemarin|berdua|sama wanda|split|bagi dua|rp\.?/gi, '').replace(/\s+/g, ' ').trim();
    ket = ket ? ket[0].toUpperCase() + ket.slice(1) : 'Pengeluaran';
    const hit = KEYWORDS.find(([re]) => re.test(seg));
    return { ket, nominal: a ? a.n : 0, kat: hit ? hit[1] : UNCLEAR, date: ymd(d), time: /kemarin/i.test(seg) ? '' : hm(base), konteks: /studio|klien|produksi|mixing|mastering/i.test(seg) ? 'Kerja' : 'Pribadi', shared };
  }).filter(d => d.nominal > 0);
}
async function smartParse(text){
  if (S.sample) {
    const now = new Date();
    const y = new Date(now); y.setDate(y.getDate() - 1);
    const prompt = `Ubah catatan pengeluaran bebas berbahasa Indonesia/Inggris menjadi baris transaksi.
Hari ini ${ymd(now)} (${HARI[now.getDay()]}) jam ${hm(now)}. Kemarin = ${ymd(y)}.
Kategori yang boleh dipakai (nama | arah): ${S.cats.map(c => c.name + ' | ' + c.arah).join('; ')}; atau "${UNCLEAR}" kalau tidak yakin.
Aturan: "25k"/"25rb" = 25000, "1,2jt" = 1200000, "25.000" = 25000. Satu baris per transaksi; pisahkan bila ada "dan", koma, atau baris baru. Jam diisi jam sekarang kecuali tanggalnya bukan hari ini (isi ""). "berdua", "sama Wanda", "split" berarti berdua=true. Konteks "Kerja" hanya bila jelas soal produksi musik, studio, klien; selain itu "Pribadi". Keterangan singkat, huruf awal kapital, tanpa nominal.
Teks: """${text}"""
Balas HANYA JSON array: [{"ket":string,"nominal":number,"kategori":string,"tanggal":"YYYY-MM-DD","jam":"HH:MM" atau "","konteks":"Pribadi"|"Kerja","berdua":boolean}]`;
    try {
      const arr = await S.sample.json(prompt, { modelTier:'quick', cache:false });
      if (Array.isArray(arr) && arr.length) {
        const names = new Set(S.cats.map(c => c.name));
        return { via:'claude', rows: arr.map(o => ({
          ket: String(o.ket || 'Pengeluaran').slice(0, 120),
          nominal: Math.abs(Math.round(Number(o.nominal) || 0)),
          kat: names.has(o.kategori) ? o.kategori : UNCLEAR,
          date: /^\d{4}-\d{2}-\d{2}$/.test(o.tanggal) ? o.tanggal : ymd(now),
          time: /^\d{2}:\d{2}$/.test(o.jam) ? o.jam : '',
          konteks: o.konteks === 'Kerja' ? 'Kerja' : 'Pribadi',
          shared: !!o.berdua
        })).filter(r => r.nominal > 0) };
      }
    } catch (e) { /* fall through to the local parser */ }
  }
  return { via:'lokal', rows: localParse(text) };
}

/* ---------- sample mode ---------- */
function enterSample(){
  S.mode = 'sample';
  const rnd = (() => { let s = 7; return () => (s = (s * 16807) % 2147483647) / 2147483647; })();
  const items = [
    ['Warung nasi','Makan & Minum',[18000,32000]],['Kopi susu','Makan & Minum',[22000,38000]],['Grab','Transport',[14500,48000]],
    ['Parkir','Transport',[3000,5000]],['Laundry','Rumah Tangga',[60000,90000]],['Sayur & buah','Groceries',[45000,140000]],
    ['Tokopedia','Belanja',[80000,260000]],['Plugin mixing','Biaya Produksi & Tools',[250000,900000]],['Toko kelontong','BELUM JELAS',[10000,95000]]
  ];
  const tx = []; const now = new Date();
  for (let back = 0; back < 75; back++) {
    const d = new Date(now); d.setDate(d.getDate() - back);
    const n = back === 0 ? 4 : 2 + Math.floor(rnd() * 4);
    for (let i = 0; i < n; i++) {
      const it = items[Math.floor(rnd() * items.length)];
      const h = 8 + Math.floor(rnd() * 13), mi = Math.floor(rnd() * 60);
      if (back === 0 && h > now.getHours()) continue;
      const cat = catInfo(it[1]) || { arah:'Keluar', sifat:'Variabel' };
      tx.push({ row:null, date:ymd(d), time:`${pad(h)}:${pad(mi)}`, src: rnd() > .4 ? 'email-kartu' : 'statement-bank', arah:cat.arah, kat:it[1], sifat:cat.sifat, konteks: it[1].startsWith('Biaya') ? 'Kerja' : 'Pribadi', ket:it[0], nominal: Math.round((it[2][0] + rnd() * (it[2][1] - it[2][0])) / 500) * 500, shared: rnd() > .85, porsi:0 });
    }
    if (d.getDate() === 1) {
      tx.push({ row:null, date:ymd(d), time:'', src:'statement-bank', arah:'Keluar', kat:'Sewa', sifat:'Tetap', konteks:'Pribadi', ket:'Sewa kamar (contoh)', nominal:4500000, shared:false, porsi:0 });
      tx.push({ row:null, date:ymd(d), time:'', src:'statement-bank', arah:'Masuk', kat:'Pendapatan Musik', sifat:'Variabel', konteks:'Kerja', ket:'Honor sesi (contoh)', nominal:9000000, shared:false, porsi:0 });
    }
  }
  tx.sort((a,b) => (b.date + b.time).localeCompare(a.date + a.time));
  S.tx = tx; S.saldo = 52000000; S.saldoNote = 'Angka contoh'; S.dash = {}; S.warn = {}; S.split = []; S.splitTotal = null;
  S.month = mkey(today());
  render();
}

function usualNow(){
  const now = new Date(), mins = now.getHours() * 60 + now.getMinutes();
  const since = new Date(now); since.setDate(since.getDate() - 60);
  const sinceS = ymd(since);
  const groups = {};
  for (const t of S.tx) {
    if (t.arah !== 'Keluar' || !t.time || t.date < sinceS || t.kat === UNCLEAR || t.nominal <= 0) continue;
    const [h, m] = t.time.split(':').map(Number);
    if (Math.abs(h * 60 + m - mins) > 90) continue;
    const key = t.ket.toLowerCase() + '|' + t.kat;
    (groups[key] = groups[key] || { ket:t.ket, kat:t.kat, n:0, nominal:t.nominal, konteks:t.konteks }).n++;
  }
  S._usual = Object.values(groups).filter(g => g.n >= 2).sort((a,b) => b.n - a.n).slice(0, 4);
  return S._usual;
}
function cumChart(k, prev){
  const W = 320, H = 126, P = { l:4, r:4, t:16, b:18 };
  const n = daysIn(k), nPrev = daysIn(prev);
  const series = (key, len, stopAt) => { const st = monthStats(key); let acc = 0; const pts = []; for (let d = 1; d <= len; d++) { if (stopAt && d > stopAt) break; acc += st.days[`${key}-${pad(d)}`] || 0; pts.push(acc); } return pts; };
  const isCur = k === mkey(today());
  const a = series(k, n, isCur ? new Date().getDate() : null), b = series(prev, nPrev);
  const max = Math.max(1, ...a, ...b);
  const x = d => P.l + (d / Math.max(n, nPrev, 1)) * (W - P.l - P.r);
  const yv = v => P.t + (1 - Math.max(0, v) / max) * (H - P.t - P.b);
  const path = pts => pts.map((v,i) => (i ? 'L' : 'M') + x(i + 1).toFixed(1) + ' ' + yv(v).toFixed(1)).join(' ');
  const area = a.length ? path(a) + ` L${x(a.length).toFixed(1)} ${H - P.b} L${x(1).toFixed(1)} ${H - P.b} Z` : '';
  const end = a.length ? `<circle cx="${x(a.length).toFixed(1)}" cy="${yv(a[a.length-1]).toFixed(1)}" r="3.5" fill="var(--accent)" stroke="var(--card)" stroke-width="2"/>` : '';
  return `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="Kumulatif pengeluaran ${monthLabel(k)} dibanding ${monthLabel(prev)}">
    ${[0.5, 1].map(f => `<line x1="${P.l}" x2="${W - P.r}" y1="${yv(max * f)}" y2="${yv(max * f)}" stroke="var(--line)" stroke-dasharray="2 3"/>`).join('')}
    <line x1="${P.l}" x2="${W - P.r}" y1="${H - P.b}" y2="${H - P.b}" stroke="var(--line)"/>
    ${b.length ? `<path d="${path(b)}" fill="none" stroke="var(--muted)" stroke-width="1.5" stroke-dasharray="4 3"/>` : ''}
    ${area ? `<path d="${area}" fill="var(--accent)" opacity=".1"/>` : ''}
    ${a.length ? `<path d="${path(a)}" fill="none" stroke="var(--accent)" stroke-width="2.2" stroke-linejoin="round"/>` : ''}
    ${end}
    <text x="${P.l}" y="${H - 4}">1</text><text x="${W - P.r}" y="${H - 4}" text-anchor="end">${Math.max(n, nPrev)}</text>
    <text x="${P.l}" y="${yv(max) - 5}">${rpShort(max)}</text>
  </svg>
  <div class="row small muted" style="gap:14px"><span class="row" style="gap:6px"><i style="width:14px;height:2px;background:var(--accent);display:inline-block"></i>${monthLabel(k)}</span><span class="row" style="gap:6px"><i style="width:14px;border-top:2px dashed var(--muted);display:inline-block"></i>${monthLabel(prev)}</span></div>`;
}

function calendar(st){
  const [y, m] = S.month.split('-').map(Number);
  const first = new Date(y, m - 1, 1);
  const lead = (first.getDay() + 6) % 7;
  const n = daysIn(S.month);
  const vals = Object.values(st.days).filter(v => v > 0).sort((a,b) => a - b);
  const cap = vals.length ? vals[Math.floor(vals.length * 0.9)] || vals[vals.length - 1] : 1;
  let html = ['Sen','Sel','Rab','Kam','Jum','Sab','Min'].map(d => `<span class="dow">${d}</span>`).join('');
  for (let i = 0; i < lead; i++) html += '<span></span>';
  for (let d = 1; d <= n; d++) {
    const key = `${S.month}-${pad(d)}`, v = st.days[key] || 0;
    const f = v > 0 ? Math.min(1, v / cap) : 0;
    const pct = Math.round(12 + f * 78);
    html += `<span class="d ${v > 0 ? 'has' : ''} ${f > .55 ? 'hot' : ''} ${key === today() ? 'today' : ''}" ${v > 0 ? `style="background:color-mix(in srgb,var(--accent) ${pct}%,var(--card))"` : ''} title="${d} ${BLN[m-1]}: ${rp(v)}">${d}</span>`;
  }
  return `<div class="cal" role="img" aria-label="Kalender pengeluaran harian ${monthLabel(S.month)}">${html}</div>`;
}
function monthlyBars(){
  const ks = []; for (let i = 11; i >= 0; i--) ks.push(addMonths(S.month, -i));
  const data = ks.map(k => { const s = monthStats(k); return { k, out:s.out, in:s.in }; });
  const max = Math.max(1, ...data.map(d => Math.max(d.out, d.in)));
  const W = 320, H = 150, P = { l:4, r:4, t:14, b:20 }, bw = (W - P.l - P.r) / 12;
  const yv = v => P.t + (1 - Math.max(0, v) / max) * (H - P.t - P.b);
  return `<div style="overflow-x:auto"><svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="Pengeluaran dan pemasukan 12 bulan">
    <line x1="${P.l}" x2="${W-P.r}" y1="${H-P.b}" y2="${H-P.b}" stroke="var(--line)"/>
    <line x1="${P.l}" x2="${W-P.r}" y1="${yv(max)}" y2="${yv(max)}" stroke="var(--line)" stroke-dasharray="2 3"/>
    <text x="${P.l}" y="${yv(max) - 4}">${rpShort(max)}</text>
    ${data.map((d, i) => {
      const x0 = P.l + i * bw;
      const sel = d.k === S.month;
      return `<rect x="${(x0 + bw*0.14).toFixed(1)}" y="${yv(d.out).toFixed(1)}" width="${(bw*0.36).toFixed(1)}" height="${Math.max(0, H - P.b - yv(d.out)).toFixed(1)}" rx="2" fill="var(--accent)" opacity="${sel ? 1 : .55}"/>
      <rect x="${(x0 + bw*0.52).toFixed(1)}" y="${yv(d.in).toFixed(1)}" width="${(bw*0.36).toFixed(1)}" height="${Math.max(0, H - P.b - yv(d.in)).toFixed(1)}" rx="2" fill="var(--in)" opacity="${sel ? 1 : .55}"/>
      <text x="${(x0 + bw/2).toFixed(1)}" y="${H - 6}" text-anchor="middle" style="${sel ? 'fill:var(--ink);font-weight:600' : ''}">${BLN[+d.k.slice(5) - 1].slice(0,3)}</text>`;
    }).join('')}
  </svg></div>
  <div class="row small muted" style="gap:14px"><span class="row" style="gap:6px"><i style="width:10px;height:10px;border-radius:2px;background:var(--accent)"></i>Keluar</span><span class="row" style="gap:6px"><i style="width:10px;height:10px;border-radius:2px;background:var(--in)"></i>Masuk</span></div>`;
}

function render(){

  if (S.onboard >= 0) { root.innerHTML = viewOnboarding(); bar.hidden = true; return; }
  if (S.mode === 'boot' || (S.mode === 'loading' && !S.tx.length)) { root.innerHTML = viewLoading(); bar.hidden = true; return; }

function newForm(over){ const n = new Date(); return { ket:'', nominal:0, kat:UNCLEAR, date:ymd(n), time:hm(n), konteks:'Pribadi', shared:false, ...over }; }
function readForm(){
  const s = S.sheet; if (!s || s.kind !== 'add' || s.mode !== 'form') return;
  const g = id => document.getElementById(id);
  if (!g('f-nom')) return;
  const nomRaw = g('f-nom').value;
  const pa = parseAmount(nomRaw.replace(/\s/g,''));
  s.form = { ...s.form, nominal: pa ? pa.n : 0, ket:g('f-ket').value.trim(), kat:g('f-kat').value, date:g('f-date').value, time:g('f-time').value, shared:g('f-shared').checked };
}

/* ---------- toast ---------- */
let toastTimer;
function toast(msg){
  let el = document.querySelector('.toast');
  if (!el) { el = document.createElement('div'); el.className = 'toast'; el.setAttribute('role','status'); document.body.appendChild(el); }
  el.textContent = msg; el.hidden = false;
  clearTimeout(toastTimer); toastTimer = setTimeout(() => { el.hidden = true; }, 3200);
}

/* ---------- events ---------- */
document.addEventListener('click', async e => {
  const el = e.target.closest('[data-act]');
  if (!el) return;
  const act = el.dataset.act;
  if (act === 'scrim' && e.target !== el) return;
  switch (act) {
    case 'ob-next': S.onboard = 1; render(); break;
    case 'ob-back': S.onboard = 0; render(); break;
    case 'ob-sample': S.onboard = -1; S.err = null; enterSample(); break;
    case 'ob-connect': S.onboard = -1; store.set('onboarded', '1'); if (S.mcp) loadAll(false); else { enterSample(); toast('Connector tidak tersedia di sini. Menampilkan data contoh.'); } break;
    case 'refresh': if (S.mcp && !S.refreshing) loadAll(true); break;
    case 'perms': try { const p = await window.claude.use('permissions'); if (p) await p.manage(); } catch { toast('Buka menu Permissions artifact ini di claude.ai'); } break;
    case 'tab': S.tab = el.dataset.tab; if (S.tab !== 'riwayat' && S.hFilter === 'jelas') S.hFilter = 'semua'; try { history.replaceState(null, '', '#' + S.tab); } catch {} render(); window.scrollTo(0, 0); break;
    case 'month': S.month = addMonths(S.month, +el.dataset.d); render(); break;
    case 'hfilter': S.hFilter = el.dataset.f; render(); break;
    case 'go-unclear': S.tab = 'riwayat'; S.hFilter = 'jelas'; render(); window.scrollTo(0, 0); break;
    case 'go-arah': S.tab = 'riwayat'; S.hFilter = 'arah'; render(); window.scrollTo(0, 0); break;
    case 'detail': { const t = S.tx[+el.dataset.i]; if (t) openSheet({ kind:'detail', t, kat:t.kat, konteks:t.konteks, shared:t.shared }); break; }
    case 'add': openSheet({ kind:'add', mode:'ketik', text:'', drafts:null, form:newForm() }); setTimeout(() => { const t = document.getElementById('k-text'); if (t) t.focus(); }, 50); break;
    case 'again': { const u = S._usual[+el.dataset.u]; if (u) openSheet({ kind:'add', mode:'form', form:newForm({ ket:u.ket, kat:u.kat, nominal:u.nominal, konteks:u.konteks }) }); break; }
    case 'again-tx': { const t = S.sheet.t; openSheet({ kind:'add', mode:'form', form:newForm({ ket:t.ket, kat:t.kat === UNCLEAR ? UNCLEAR : t.kat, nominal:Math.abs(t.nominal), konteks:t.konteks, shared:t.shared }) }); break; }
    case 'close': case 'scrim': closeSheet(); break;
    case 'addmode': readForm(); if (S.sheet.mode === 'ketik') { const t = document.getElementById('k-text'); if (t) S.sheet.text = t.value; } S.sheet.mode = el.dataset.m; renderSheet(); break;
    case 'fk': readForm(); S.sheet.form.konteks = el.dataset.v; renderSheet(); break;
    case 'ek': S.sheet.konteks = el.dataset.v; renderSheet(); break;
    case 'parse': {
      const text = document.getElementById('k-text').value.trim();
      S.sheet.text = text;
      if (!text) { toast('Tulis dulu transaksinya'); break; }
      S.sheet.busy = 'parse'; renderSheet();
      const res = await smartParse(text);
      if (!S.sheet) break;
      S.sheet.busy = null; S.sheet.drafts = res.rows; S.sheet.via = res.via; renderSheet();
      if (!res.rows.length) toast('Nominalnya tidak ketemu. Contoh: kopi 25k');
      break;
    }
    case 'drop': S.sheet.drafts.splice(+el.dataset.i, 1); renderSheet(); break;
    case 'save-drafts': {
      if (S.sheet.busy) break;
      S.sheet.busy = 'save'; renderSheet();
      const ok = await saveDrafts(S.sheet.drafts);
      if (ok) { closeSheet(); render(); } else if (S.sheet) { S.sheet.busy = null; renderSheet(); }
      break;
    }
    case 'save-form': {
      if (S.sheet.busy) break;
      readForm();
      const f = S.sheet.form;
      if (!f.nominal) { toast('Nominal belum diisi'); break; }
      if (!f.ket) { toast('Keterangan belum diisi'); break; }
      if (!f.date) { toast('Tanggal belum diisi'); break; }
      S.sheet.busy = 'save'; renderSheet();
      const ok = await saveDrafts([f]);
      if (ok) { closeSheet(); render(); } else if (S.sheet) { S.sheet.busy = null; renderSheet(); }
      break;
    }
    case 'save-edit': {
      const s = S.sheet; if (s.busy) break;
      s.busy = true; renderSheet();
      const ok = await saveEdit(s.t, { kat:s.kat, konteks:s.konteks, shared:s.shared });
      if (ok) { closeSheet(); render(); } else if (S.sheet) { S.sheet.busy = false; renderSheet(); }
      break;
    }
  }
});
document.addEventListener('change', e => {
  const t = e.target;
  if (!S.sheet) return;
  if (t.id === 'e-kat') { S.sheet.kat = t.value; renderSheet(); }
  if (t.id === 'e-shared') { S.sheet.shared = t.checked; renderSheet(); }
  if (t.dataset && t.dataset.d != null && S.sheet.drafts) {
    const r = S.sheet.drafts[+t.dataset.d]; if (!r) return;
    if (t.dataset.k === 'nominal') { const pa = parseAmount(t.value.replace(/\s/g,'')); r.nominal = pa ? pa.n : 0; }
    else r[t.dataset.k] = t.value;
  }
});
document.addEventListener('input', e => {
  if (e.target.id === 'h-search') { S.hQuery = e.target.value; render(); }
});
document.addEventListener('submit', e => {
  e.preventDefault();
  if (e.target.dataset.form === 'quick') {
    const v = document.getElementById('quick-input').value.trim();
    openSheet({ kind:'add', mode:'ketik', text:v, drafts:null, form:newForm() });
    if (v) document.querySelector('[data-act="parse"]').click();
  }
});
document.addEventListener('keydown', e => { if (e.key === 'Escape' && S.sheet) closeSheet(); });
window.addEventListener('hashchange', () => { const h = location.hash.slice(1); if (['beranda','riwayat','laporan','kas'].includes(h)) { S.tab = h; render(); } });

/* ---------- boot ---------- */
const h0 = location.hash.slice(1);
if (['beranda','riwayat','laporan','kas'].includes(h0)) S.tab = h0;
S.month = mkey(today());
render();
(async () => {
  const c = window.claude;
  const [mcp, sample] = await Promise.all([
    c && c.use ? c.use('mcp').catch(() => null) : null,
    c && c.use ? c.use('sample').catch(() => null) : null
  ]);
  S.mcp = mcp; S.sample = sample;
  if (S.onboard >= 0) { S.mode = 'idle'; render(); return; }
  if (mcp) loadAll(false); else enterSample();
})();
})();
</script>
